title: SENSE
tagline: Software-Defined Network for End-to-End Networked Science
email: sense-info@es.net
description: >-
  SENSE lets science workflows request, provision, monitor, and troubleshoot
  end-to-end network services across sites and administrative domains.
url: https://sdn-sense.dev
baseurl: ""
repository: sdn-sense/sdn-sense.github.io
github_username: sdn-sense
current_release: "1.6.5"
logo: /assets/images/sense-mark.svg

lang: en-US
timezone: America/Los_Angeles
markdown: kramdown
highlighter: rouge
permalink: /releases/:title/
excerpt_separator: "<!--more-->"

# Keep the GitHub Pages-compatible dependency set. Local layouts provide the
# public-facing design while the remote theme remains available as a fallback.
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default
search: false

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - Rakefile
  - dev.sh
  - scripts
  - vendor

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: release
      category: releases
      author: SENSE team
      image: /images/sense-arch.png
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      image:
        path: /assets/images/social/sense-social-card.png
        width: 1200
        height: 630
        alt: SENSE end-to-end network orchestration for science workflows

author:
  name: SENSE team
  bio: End-to-end network orchestration for science workflows.
  links:
    - label: GitHub
      url: https://github.com/sdn-sense
    - label: Email
      url: mailto:sense-info@es.net

social:
  name: SENSE
  links:
    - https://github.com/sdn-sense
    - https://www.es.net/network-r-and-d/sense/

footer:
  links:
    - label: GitHub
      url: https://github.com/sdn-sense
    - label: Contact
      url: mailto:sense-info@es.net
