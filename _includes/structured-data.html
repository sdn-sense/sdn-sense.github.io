{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ "/#organization" | absolute_url | jsonify }},
      "name": "SENSE",
      "alternateName": "Software-Defined Network for End-to-End Networked Science",
      "url": {{ "/" | absolute_url | jsonify }},
      "logo": {{ "/assets/images/sense-mark.svg" | absolute_url | jsonify }},
      "email": "sense-info@es.net",
      "sameAs": [
        "https://github.com/sdn-sense",
        "https://www.es.net/network-r-and-d/sense/",
        "https://sense.es.net/"
      ]
    },
    {
      "@type": "SoftwareSourceCode",
      "name": "SiteRM",
      "description": "Site resource management, policy enforcement, provisioning, monitoring, and diagnostics for SENSE network services.",
      "codeRepository": "https://github.com/sdn-sense/siterm",
      "programmingLanguage": "Python",
      "runtimePlatform": "Linux",
      "version": {{ site.current_release | jsonify }},
      "url": {{ "/install-quick-start/" | absolute_url | jsonify }}
    },
    {
      "@type": "ItemList",
      "name": "Participating SENSE sites and network partners",
      "itemListElement": [
        {% for participant in site.data.participants.organizations %}
        {
          "@type": "ListItem",
          "position": {{ forloop.index }},
          "item": {
            "@type": "Organization",
            "name": {{ participant.name | jsonify }},
            "url": {{ participant.url | jsonify }}
          }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  ]
}
</script>
{% elsif page.layout == "blog_archive" and paginator %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Blog",
      "@id": {{ "/blog/#blog" | absolute_url | jsonify }},
      "name": "SENSE Blog",
      "description": "SENSE releases, conference presentations, and practical network-service guides.",
      "url": {{ "/blog/" | absolute_url | jsonify }},
      "publisher": {"@type": "Organization", "name": "SENSE", "url": {{ "/" | absolute_url | jsonify }}}
    },
    {
      "@type": "ItemList",
      "name": {{ page.title | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "numberOfItems": {{ paginator.posts.size }},
      "itemListElement": [
        {% assign blog_position_offset = paginator.page | minus: 1 | times: paginator.per_page %}
        {% for post in paginator.posts %}
        {
          "@type": "ListItem",
          "position": {{ blog_position_offset | plus: forloop.index }},
          "item": {
            "@type": "BlogPosting",
            "name": {{ post.title | jsonify }},
            "description": {{ post.summary | default: post.description | strip_html | jsonify }},
            "datePublished": {{ post.date | date_to_xmlschema | jsonify }},
            "url": {{ post.url | absolute_url | jsonify }},
            "image": {{ post.cover | absolute_url | jsonify }},
            "author": {"@type": "Organization", "name": "SENSE team"}
          }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  ]
}
</script>
{% elsif page.url == "/docs/publications/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "Selected SENSE publications",
  "itemListElement": [
    {% for publication in site.data.publications %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "ScholarlyArticle",
        "name": {{ publication.title | jsonify }},
        "description": {{ publication.summary | jsonify }},
        "datePublished": {{ publication.year | append: "-01-01" | jsonify }},
        "url": {{ publication.url | jsonify }},
        "author": [
          {% for author in publication.authors %}
          {"@type": "Person", "name": {{ author | jsonify }}}{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ]
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
