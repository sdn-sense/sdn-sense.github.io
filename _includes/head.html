<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fb">
  <link rel="icon" href="{{ '/assets/images/sense-mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} updates" href="{{ '/feed.xml' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  {% seo %}
  {% if page.robots %}<meta name="robots" content="{{ page.robots | escape }}">{% endif %}
  {% if paginator.previous_page_path %}<link rel="prev" href="{{ paginator.previous_page_path | absolute_url }}">{% endif %}
  {% if paginator.next_page_path %}<link rel="next" href="{{ paginator.next_page_path | absolute_url }}">{% endif %}
  {% include structured-data.html %}
  {% assign asset_version = site.github.build_revision | default: site.time | date: '%s' %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ asset_version }}">
  <script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ asset_version }}"></script>
</head>
