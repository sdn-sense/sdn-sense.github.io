---
layout: default
---
<header class="page-banner">
  <div class="shell page-banner-inner">
    <p class="eyebrow">{% if page.sidebar.nav == 'docs' %}Documentation{% else %}SENSE{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p>{{ page.summary }}</p>{% endif %}
  </div>
</header>

<div class="shell page-shell{% if page.sidebar.nav == 'docs' %} has-sidebar{% endif %}">
  {% if page.sidebar.nav == 'docs' %}{% include docs-sidebar.html %}{% endif %}
  <article class="prose page-content">
    {{ content }}
  </article>
</div>
