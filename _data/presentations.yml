# Presentation archive, newest first.
#
# To add a presentation:
# 1. Copy the approved source into /assets/presentations/ with a stable,
#    lowercase filename containing no spaces.
# 2. Add a first-slide/page preview under /assets/images/presentations/.
# 3. Add one entry below. Dates use YYYY-MM-DD and paths are site-relative.
# 4. Mark drafts accurately in `status`; do not publish operational diagrams or
#    internal planning material without explicit approval.
# 5. When no approved local file exists, use `external_url` and `cta_label` to
#    point at the official program or conference-hosted presentation instead.

