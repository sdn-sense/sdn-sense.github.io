- title: "ATLAS journey integrating into the SENSE/Rucio Priority Data Transfer Service"
  event: "28th Conference on Computing in High Energy and Nuclear Physics (CHEP 2026)"
  event_url: "https://indico.cern.ch/event/1471803/contributions/6967431/"
  location: "Chulalongkorn University, Bangkok, Thailand"
  date: 2026-05-26
  time: "2:39-2:57 p.m. Asia/Bangkok"
  speakers:
    - "Aashay Arora"
  summary: >-
    The ATLAS expansion of the Rucio/SENSE priority data-transfer service,
    using on-demand bandwidth-guaranteed network circuits for high-priority
    HL-LHC workflows. The talk compares early deployments at NET2/UMass and
    UChicago, including direct network integration and a software-router
    approach for sites with restricted network access.
  format: "PDF"
  length: "21 slides"
  status: "Conference presentation"
