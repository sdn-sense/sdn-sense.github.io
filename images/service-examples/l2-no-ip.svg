<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Layer 2 point-to-point path through site routers and example research networks</title>
  <desc id="desc">Endpoint A connects through one Site A network router, an illustrative CENIC and ESnet provider path, and one Site B network router to Endpoint B. SENSE does not assign IP addresses.</desc>
  <rect width="960" height="360" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Layer 2 point-to-point: no managed IPs</text>
    <text x="480" y="68" text-anchor="middle" font-size="15" fill="#52657a">SENSE provisions the Ethernet path; the application owns addressing</text>

    <rect x="28" y="100" width="250" height="183" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="153" y="130" text-anchor="middle" font-size="19" font-weight="700">Site A</text>
    <rect x="47" y="151" width="105" height="72" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="99" y="180" text-anchor="middle" font-size="16" font-weight="700">Endpoint A</text>
    <text x="99" y="204" text-anchor="middle" font-size="14" fill="#52657a">assign_ip: false</text>
    <rect x="166" y="151" width="92" height="72" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="212" y="178" text-anchor="middle" font-size="15" font-weight="700">Site network</text>
    <text x="212" y="201" text-anchor="middle" font-size="15" font-weight="700">router</text>
    <line x1="152" y1="187" x2="166" y2="187" stroke="#2c8c84" stroke-width="5"/>
    <text x="153" y="256" text-anchor="middle" font-size="15" fill="#34465b">Existing IP or raw Ethernet</text>

    <rect x="682" y="100" width="250" height="183" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="807" y="130" text-anchor="middle" font-size="19" font-weight="700">Site B</text>
    <rect x="702" y="151" width="92" height="72" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="748" y="178" text-anchor="middle" font-size="15" font-weight="700">Site network</text>
    <text x="748" y="201" text-anchor="middle" font-size="15" font-weight="700">router</text>
    <rect x="808" y="151" width="105" height="72" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="860" y="180" text-anchor="middle" font-size="16" font-weight="700">Endpoint B</text>
    <text x="860" y="204" text-anchor="middle" font-size="14" fill="#52657a">assign_ip: false</text>
    <line x1="794" y1="187" x2="808" y2="187" stroke="#2c8c84" stroke-width="5"/>
    <text x="807" y="256" text-anchor="middle" font-size="15" fill="#34465b">Existing IP or raw Ethernet</text>

    <line x1="258" y1="187" x2="702" y2="187" stroke="#2375e8" stroke-width="10" stroke-linecap="round"/>
    <text x="480" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#175ec9">Illustrative network path</text>
    <rect x="325" y="151" width="130" height="72" rx="14" fill="#071b31"/>
    <text x="390" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">CENIC</text>
    <text x="390" y="204" text-anchor="middle" font-size="14" fill="#c9dae8">regional network</text>
    <rect x="505" y="151" width="130" height="72" rx="14" fill="#071b31"/>
    <text x="570" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">ESnet</text>
    <text x="570" y="204" text-anchor="middle" font-size="14" fill="#c9dae8">backbone network</text>
    <text x="480" y="253" text-anchor="middle" font-size="16" font-weight="700" fill="#175ec9">One VLAN-backed broadcast domain</text>

    <rect x="160" y="308" width="640" height="36" rx="18" fill="#edf7fc" stroke="#c7e6f4"/>
    <text x="480" y="331" text-anchor="middle" font-size="14" fill="#34465b">Example providers only — SENSE computes the actual path from participating network domains</text>
  </g>
</svg>
