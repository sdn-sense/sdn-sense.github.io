<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Layer 3 BGP multipath through site routers and two example provider paths</title>
  <desc id="desc">One network router at each site exchanges the same requested prefixes over two independent SENSE peerings. Illustrative provider paths cross CENIC and ESnet or Internet2 and ESnet.</desc>
  <rect width="960" height="420" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Advanced Layer 3: BGP multipath</text>
    <text x="480" y="68" text-anchor="middle" font-size="15" fill="#52657a">Two independent peerings can carry equal-cost routes to the same destination</text>

    <path d="M260 188C360 86 600 86 700 188" fill="none" stroke="#2375e8" stroke-width="10" stroke-linecap="round"/>
    <path d="M260 212C360 304 600 304 700 212" fill="none" stroke="#31c4f3" stroke-width="10" stroke-linecap="round"/>

    <rect x="25" y="105" width="270" height="220" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="160" y="138" text-anchor="middle" font-size="19" font-weight="700">Site A · AS 64496</text>
    <rect x="60" y="162" width="200" height="78" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="160" y="190" text-anchor="middle" font-size="17" font-weight="700">Site network router</text>
    <text x="160" y="216" text-anchor="middle" font-size="15" fill="#2c8c84">ECMP enabled</text>
    <text x="160" y="284" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="#175ec9">2001:db8:100::/64</text>

    <rect x="665" y="105" width="270" height="220" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="800" y="138" text-anchor="middle" font-size="19" font-weight="700">Site B · AS 64497</text>
    <rect x="700" y="162" width="200" height="78" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="800" y="190" text-anchor="middle" font-size="17" font-weight="700">Site network router</text>
    <text x="800" y="216" text-anchor="middle" font-size="15" fill="#2c8c84">ECMP enabled</text>
    <text x="800" y="284" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="#175ec9">2001:db8:200::/64</text>

    <text x="480" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#175ec9">Illustrative path 1</text>
    <rect x="350" y="108" width="106" height="42" rx="13" fill="#071b31"/>
    <text x="403" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">CENIC</text>
    <rect x="504" y="108" width="106" height="42" rx="13" fill="#071b31"/>
    <text x="557" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ESnet</text>
    <rect x="390" y="176" width="180" height="50" rx="15" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="480" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#2c8c84">Same destination</text>
    <text x="480" y="217" text-anchor="middle" font-size="14" fill="#34465b">two equal-cost next hops</text>
    <rect x="350" y="244" width="106" height="42" rx="13" fill="#071b31"/>
    <text x="403" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Internet2</text>
    <rect x="504" y="244" width="106" height="42" rx="13" fill="#071b31"/>
    <text x="557" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ESnet</text>
    <text x="480" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#175ec9">Illustrative path 2</text>

    <rect x="125" y="348" width="710" height="50" rx="25" fill="#f4ecfb" stroke="#d8c0ef"/>
    <text x="480" y="369" text-anchor="middle" font-size="15" font-weight="700" fill="#7e3fbf">Capability-dependent · example providers only</text>
    <text x="480" y="389" text-anchor="middle" font-size="14" fill="#34465b">Use only when both site routing services advertise Layer 3 BGP multipath support</text>
  </g>
</svg>
