<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Diagnostic IPs on site routers across an example research-network path</title>
  <desc id="desc">Each endpoint has a service address, while the single network router at each site has a separate diagnostic VLAN address. The illustrative path crosses CENIC and ESnet.</desc>
  <defs>
    <marker id="probe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7e3fbf"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Diagnostic IP: test the provisioned Layer 2 path</text>
    <text x="480" y="68" text-anchor="middle" font-size="15" fill="#52657a">The diagnostic address lives on the one SiteRM-controlled router at each site</text>

    <rect x="20" y="100" width="305" height="222" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="172" y="130" text-anchor="middle" font-size="19" font-weight="700">Site A</text>
    <rect x="42" y="151" width="116" height="82" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="100" y="181" text-anchor="middle" font-size="16" font-weight="700">Endpoint A</text>
    <text x="100" y="207" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">…::10/64</text>
    <rect x="169" y="130" width="138" height="126" rx="12" fill="#f4ecfb" stroke="#7e3fbf" stroke-width="2"/>
    <text x="238" y="157" text-anchor="middle" font-size="15" font-weight="700">Site network</text>
    <text x="238" y="178" text-anchor="middle" font-size="15" font-weight="700">router</text>
    <text x="238" y="201" text-anchor="middle" font-size="14">VLAN debug</text>
    <text x="238" y="221" text-anchor="middle" font-size="14">interface</text>
    <text x="238" y="245" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="#7e3fbf">…::1/64</text>
    <line x1="158" y1="192" x2="169" y2="192" stroke="#2c8c84" stroke-width="5"/>

    <rect x="635" y="100" width="305" height="222" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="787" y="130" text-anchor="middle" font-size="19" font-weight="700">Site B</text>
    <rect x="653" y="130" width="138" height="126" rx="12" fill="#f4ecfb" stroke="#7e3fbf" stroke-width="2"/>
    <text x="722" y="157" text-anchor="middle" font-size="15" font-weight="700">Site network</text>
    <text x="722" y="178" text-anchor="middle" font-size="15" font-weight="700">router</text>
    <text x="722" y="201" text-anchor="middle" font-size="14">VLAN debug</text>
    <text x="722" y="221" text-anchor="middle" font-size="14">interface</text>
    <text x="722" y="245" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="#7e3fbf">…::2/64</text>
    <rect x="802" y="151" width="116" height="82" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="860" y="181" text-anchor="middle" font-size="16" font-weight="700">Endpoint B</text>
    <text x="860" y="207" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">…::20/64</text>
    <line x1="791" y1="192" x2="802" y2="192" stroke="#2c8c84" stroke-width="5"/>

    <line x1="307" y1="192" x2="653" y2="192" stroke="#2375e8" stroke-width="10" stroke-linecap="round"/>
    <text x="480" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#175ec9">Illustrative network path</text>
    <rect x="337" y="156" width="126" height="72" rx="14" fill="#071b31"/>
    <text x="400" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">CENIC</text>
    <text x="400" y="209" text-anchor="middle" font-size="14" fill="#c9dae8">regional network</text>
    <rect x="497" y="156" width="126" height="72" rx="14" fill="#071b31"/>
    <text x="560" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">ESnet</text>
    <text x="560" y="209" text-anchor="middle" font-size="14" fill="#c9dae8">backbone network</text>
    <line x1="310" y1="270" x2="650" y2="270" stroke="#7e3fbf" stroke-width="3" stroke-dasharray="8 7" marker-start="url(#probe-arrow)" marker-end="url(#probe-arrow)"/>
    <text x="480" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#7e3fbf">Ping or trace between the router debug interfaces</text>

    <rect x="150" y="350" width="660" height="36" rx="18" fill="#f4ecfb" stroke="#d8c0ef"/>
    <text x="480" y="373" text-anchor="middle" font-size="14" fill="#34465b">Example providers only — debug IP requires support from every participating switching service</text>
  </g>
</svg>
