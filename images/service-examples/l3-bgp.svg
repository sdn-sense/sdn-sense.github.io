<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Layer 3 BGP peering through site routers and example research networks</title>
  <desc id="desc">The single network router at each site establishes BGP over a SENSE-provisioned peering VLAN. An illustrative transport path crosses CENIC and ESnet, and each router advertises one documentation prefix.</desc>
  <defs>
    <marker id="route-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2c8c84"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Layer 3: BGP peering over a provisioned VLAN</text>
    <text x="480" y="68" text-anchor="middle" font-size="15" fill="#52657a">The peering link crosses participating networks; routed prefixes remain policy-controlled</text>

    <rect x="25" y="100" width="300" height="250" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="175" y="132" text-anchor="middle" font-size="19" font-weight="700">Site A · AS 64496</text>
    <rect x="62" y="153" width="226" height="82" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="175" y="181" text-anchor="middle" font-size="17" font-weight="700">Site network router</text>
    <text x="175" y="207" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="#2c8c84">peer …:ffff::1/64</text>
    <rect x="62" y="264" width="226" height="56" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="175" y="288" text-anchor="middle" font-size="15" font-weight="700">Workload prefix</text>
    <text x="175" y="310" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="#175ec9">2001:db8:100::/64</text>

    <rect x="635" y="100" width="300" height="250" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="785" y="132" text-anchor="middle" font-size="19" font-weight="700">Site B · AS 64497</text>
    <rect x="672" y="153" width="226" height="82" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="785" y="181" text-anchor="middle" font-size="17" font-weight="700">Site network router</text>
    <text x="785" y="207" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="#2c8c84">peer …:ffff::2/64</text>
    <rect x="672" y="264" width="226" height="56" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="785" y="288" text-anchor="middle" font-size="15" font-weight="700">Workload prefix</text>
    <text x="785" y="310" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="#175ec9">2001:db8:200::/64</text>

    <line x1="288" y1="194" x2="672" y2="194" stroke="#2375e8" stroke-width="10" stroke-linecap="round"/>
    <text x="480" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#175ec9">Illustrative network path</text>
    <rect x="337" y="158" width="126" height="72" rx="14" fill="#071b31"/>
    <text x="400" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">CENIC</text>
    <text x="400" y="211" text-anchor="middle" font-size="14" fill="#c9dae8">regional network</text>
    <rect x="497" y="158" width="126" height="72" rx="14" fill="#071b31"/>
    <text x="560" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">ESnet</text>
    <text x="560" y="211" text-anchor="middle" font-size="14" fill="#c9dae8">backbone network</text>
    <text x="480" y="254" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">Peering VLAN · 2001:db8:ffff::/64</text>
    <line x1="315" y1="278" x2="645" y2="278" stroke="#2c8c84" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#route-arrow)" marker-end="url(#route-arrow)"/>
    <text x="480" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#2c8c84">BGP exchanges approved prefixes</text>
    <text x="480" y="330" text-anchor="middle" font-size="14" fill="#52657a">Site policy supplies ASNs, route maps, and address filters</text>

    <rect x="130" y="372" width="700" height="32" rx="16" fill="#eaf8f5" stroke="#b9ded8"/>
    <text x="480" y="394" text-anchor="middle" font-size="14" fill="#34465b">Example providers only — SENSE computes the actual path from participating network domains</text>
  </g>
</svg>
