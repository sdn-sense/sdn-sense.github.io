<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Shares of a 40 gigabit request on two Kubernetes workers</title>
  <desc id="desc">Two workers with one 100 gigabit NIC each run two XRootD pods each. Every pod has a capacity of 50 Gbps out of a total of 200 Gbps, so its share of a 40 Gbps request is 10 Gbps. All four pods together send up to 40 Gbps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2375e8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2c8c84"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e3fbf"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b42318"/></marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker>
  </defs>
  <rect width="960" height="470" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480.0" y="42" text-anchor="middle" font-size="24" font-weight="700">One 40 Gbps request, two workers, four pods</text>
    <text x="480.0" y="68" text-anchor="middle" font-size="15" fill="#52657a">Each pod gets the part of the request that matches its part of the total capacity</text>
    <rect x="25" y="88" width="910" height="46" rx="14" fill="#071b31" stroke="#071b31" stroke-width="2"/>
    <text x="480" y="117" text-anchor="middle" font-size="16" font-weight="700" font-family="IBM Plex Mono, monospace" fill="#fff">40 Gbps guaranteedCapped x 50 / 200 = 10 Gbps per pod</text>
    <rect x="25" y="152" width="445" height="196" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="247" y="180" text-anchor="middle" font-size="19" font-weight="700">Worker 1</text>
    <rect x="45" y="196" width="193" height="88" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="141" y="220" text-anchor="middle" font-size="16" font-weight="700">XRootD pod 1</text>
    <text x="141" y="244" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">net1 2001:db8:10::100</text>
    <text x="141" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#2c8c84">siterm-qos: 10 Gbps</text>
    <line x1="141" y1="284" x2="141" y2="302" stroke="#2c8c84" stroke-width="4"/>
    <rect x="257" y="196" width="193" height="88" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="353" y="220" text-anchor="middle" font-size="16" font-weight="700">XRootD pod 2</text>
    <text x="353" y="244" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">net1 2001:db8:10::200</text>
    <text x="353" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#2c8c84">siterm-qos: 10 Gbps</text>
    <line x1="353" y1="284" x2="353" y2="302" stroke="#2c8c84" stroke-width="4"/>
    <rect x="45" y="304" width="405" height="32" rx="8" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="247" y="325" text-anchor="middle" font-size="14">100 Gbps NIC, SENSE traffic up to 20 Gbps</text>
    <line x1="247" y1="336" x2="480" y2="372" stroke="#2375e8" stroke-width="6"/>
    <rect x="490" y="152" width="445" height="196" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="712" y="180" text-anchor="middle" font-size="19" font-weight="700">Worker 2</text>
    <rect x="510" y="196" width="193" height="88" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="606" y="220" text-anchor="middle" font-size="16" font-weight="700">XRootD pod 3</text>
    <text x="606" y="244" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">net1 2001:db8:10::300</text>
    <text x="606" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#2c8c84">siterm-qos: 10 Gbps</text>
    <line x1="606" y1="284" x2="606" y2="302" stroke="#2c8c84" stroke-width="4"/>
    <rect x="722" y="196" width="193" height="88" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="818" y="220" text-anchor="middle" font-size="16" font-weight="700">XRootD pod 4</text>
    <text x="818" y="244" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">net1 2001:db8:10::400</text>
    <text x="818" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#2c8c84">siterm-qos: 10 Gbps</text>
    <line x1="818" y1="284" x2="818" y2="302" stroke="#2c8c84" stroke-width="4"/>
    <rect x="510" y="304" width="405" height="32" rx="8" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="712" y="325" text-anchor="middle" font-size="14">100 Gbps NIC, SENSE traffic up to 20 Gbps</text>
    <line x1="712" y1="336" x2="480" y2="372" stroke="#2375e8" stroke-width="6"/>
    <rect x="330" y="366" width="300" height="44" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="480" y="393" text-anchor="middle" font-size="16" font-weight="700">Site router: up to 40 Gbps</text>
    <rect x="200" y="424" width="560" height="34" rx="17" fill="#edf7fc" stroke="#c7e6f4"/>
    <text x="480.0" y="446" text-anchor="middle" font-size="14" fill="#34465b">SITERM_QOS_CAPACITY=50000 and SITERM_QOS_TOTAL=200000 on every pod</text>
  </g>
</svg>
