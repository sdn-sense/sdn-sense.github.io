<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="title desc">
  <title id="title">softCapped, 10 Gbps: a base rate, more when there is room</title>
  <desc id="desc">A 10 gigabit softCapped request. The host may use up to 99 Gbps. The switch forwards up to 10 Gbps normally and marks traffic above that, up to 100 Gbps, to be dropped first.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2375e8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2c8c84"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e3fbf"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b42318"/></marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker>
  </defs>
  <rect width="960" height="486" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480.0" y="42" text-anchor="middle" font-size="24" font-weight="700">softCapped, 10 Gbps: a base rate, more when there is room</text>
    <text x="480.0" y="68" text-anchor="middle" font-size="15" fill="#52657a">The request sets the base. The free capacity sets the ceiling</text>
    <rect x="25" y="92" width="265" height="150" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="157" y="119" text-anchor="middle" font-size="19" font-weight="700">Site A</text>
    <rect x="44" y="136" width="116" height="84" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="102" y="163" text-anchor="middle" font-size="16" font-weight="700">Endpoint A</text>
    <text x="102" y="186" text-anchor="middle" font-size="14" fill="#52657a">100G NIC</text>
    <text x="102" y="207" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">vlan.3600</text>
    <rect x="177" y="142" width="94" height="72" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="224" y="170" text-anchor="middle" font-size="15" font-weight="700">Site switch</text>
    <text x="224" y="193" text-anchor="middle" font-size="14" fill="#52657a">100G ports</text>
    <rect x="670" y="92" width="265" height="150" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="802" y="119" text-anchor="middle" font-size="19" font-weight="700">Site B</text>
    <rect x="800" y="136" width="116" height="84" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="858" y="163" text-anchor="middle" font-size="16" font-weight="700">Endpoint B</text>
    <text x="858" y="186" text-anchor="middle" font-size="14" fill="#52657a">100G NIC</text>
    <text x="858" y="207" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">vlan.3600</text>
    <rect x="689" y="142" width="94" height="72" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="736" y="170" text-anchor="middle" font-size="15" font-weight="700">Site switch</text>
    <text x="736" y="193" text-anchor="middle" font-size="14" fill="#52657a">100G ports</text>
    <line x1="160" y1="178" x2="177" y2="178" stroke="#2c8c84" stroke-width="5"/>
    <line x1="783" y1="178" x2="800" y2="178" stroke="#2c8c84" stroke-width="5"/>
    <line x1="271" y1="178" x2="689" y2="178" stroke="#2375e8" stroke-width="10" stroke-linecap="round"/>
    <text x="480" y="119" text-anchor="middle" font-size="14" font-weight="700" fill="#175ec9">Illustrative network path</text>
    <rect x="325" y="142" width="130" height="72" rx="14" fill="#071b31" stroke="#071b31" stroke-width="2"/>
    <text x="390" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">CENIC</text>
    <text x="390" y="195" text-anchor="middle" font-size="14" fill="#c9dae8">regional network</text>
    <rect x="505" y="142" width="130" height="72" rx="14" fill="#071b31" stroke="#071b31" stroke-width="2"/>
    <text x="570" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">ESnet</text>
    <text x="570" y="195" text-anchor="middle" font-size="14" fill="#c9dae8">backbone network</text>
    <text x="480" y="238" text-anchor="middle" font-size="14" fill="#52657a">Providers apply their own QoS for the same class</text>
    <circle cx="50" cy="138" r="13" fill="#101c2c"/>
    <text x="50" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <circle cx="265" cy="144" r="13" fill="#101c2c"/>
    <text x="265" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <circle cx="806" cy="138" r="13" fill="#101c2c"/>
    <text x="806" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <circle cx="777" cy="144" r="13" fill="#101c2c"/>
    <text x="777" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="25" y="262" width="445" height="158" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <circle cx="55" cy="290" r="13" fill="#101c2c"/>
    <text x="55" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="79" y="296" text-anchor="start" font-size="17" font-weight="700">Host: the SiteRM Agent shapes the VLAN</text>
    <rect x="45.0" y="316" width="199.5" height="52" rx="6" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <text x="144.8" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">up to 99 Gbps</text>
    <text x="144.8" y="357" text-anchor="middle" font-size="14" fill="#fff">sent</text>
    <rect x="247.5" y="316" width="202.5" height="52" rx="6" fill="#edf7fc" stroke="#31c4f3" stroke-width="1.5"/>
    <text x="348.8" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#101c2c">above 99 Gbps</text>
    <text x="348.8" y="357" text-anchor="middle" font-size="14" fill="#101c2c">waits in the queue</text>
    <text x="247" y="398" text-anchor="middle" font-size="14" fill="#34465b">10 Gbps is the base. The rest of the NIC may be borrowed</text>
    <rect x="490" y="262" width="445" height="158" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <circle cx="520" cy="290" r="13" fill="#101c2c"/>
    <text x="520" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="544" y="296" text-anchor="start" font-size="17" font-weight="700">Switch: SiteRM sets an input policer</text>
    <rect x="510.0" y="316" width="199.5" height="52" rx="6" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <text x="609.8" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">up to 10 Gbps</text>
    <text x="609.8" y="357" text-anchor="middle" font-size="14" fill="#fff">forwarded</text>
    <rect x="712.5" y="316" width="202.5" height="52" rx="6" fill="#fff3d6" stroke="#b7791f" stroke-width="1.5"/>
    <text x="813.8" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#101c2c">10 to 100 Gbps</text>
    <text x="813.8" y="357" text-anchor="middle" font-size="14" fill="#101c2c">dropped first if full</text>
    <text x="712" y="398" text-anchor="middle" font-size="14" fill="#34465b">Traffic class 4. The extra traffic is marked as droppable</text>
    <rect x="100" y="436" width="760" height="34" rx="17" fill="#edf7fc" stroke="#c7e6f4"/>
    <text x="480.0" y="458" text-anchor="middle" font-size="14" fill="#34465b">Block widths are not to scale. Example providers only; SENSE computes the real path</text>
  </g>
</svg>
