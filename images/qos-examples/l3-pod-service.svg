<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="title desc">
  <title id="title">siterm-qos runs next to XRootD</title>
  <desc id="desc">The siterm-qos service runs inside the XRootD container. It reads active requests from the SiteRM Frontend and writes traffic classes on net1. SENSE traffic uses one class and all other traffic uses the default class.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2375e8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2c8c84"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e3fbf"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b42318"/></marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker>
  </defs>
  <rect width="960" height="486" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480.0" y="42" text-anchor="middle" font-size="24" font-weight="700">siterm-qos runs next to XRootD</text>
    <text x="480.0" y="68" text-anchor="middle" font-size="15" fill="#52657a">One file in the same network namespace writes the rules on net1</text>
    <rect x="25" y="92" width="690" height="330" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="370" y="120" text-anchor="middle" font-size="19" font-weight="700">Kubernetes node</text>
    <rect x="44" y="136" width="296" height="190" rx="12" fill="#fff" stroke="#adc1d1" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="192" y="162" text-anchor="middle" font-size="16" font-weight="700">Host network namespace</text>
    <rect x="400" y="136" width="296" height="190" rx="12" fill="#fff" stroke="#adc1d1" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="548" y="162" text-anchor="middle" font-size="16" font-weight="700">Pod network namespace</text>
    <line x1="370" y1="134" x2="370" y2="330" stroke="#b42318" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="370" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#b42318">namespace boundary</text>
    <rect x="210" y="362" width="320" height="46" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="370" y="382" text-anchor="middle" font-size="15" font-weight="700">data NIC</text>
    <text x="370" y="400" text-anchor="middle" font-size="14" fill="#52657a">parent of net1 (macvlan)</text>
    <line x1="530" y1="385" x2="760" y2="385" stroke="#2375e8" stroke-width="10" stroke-linecap="round"/>
    <rect x="760" y="340" width="175" height="82" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="847" y="374" text-anchor="middle" font-size="17" font-weight="700">Site router</text>
    <text x="847" y="398" text-anchor="middle" font-size="14" fill="#52657a">and the SENSE path</text>
    <rect x="420" y="262" width="256" height="50" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="548" y="283" text-anchor="middle" font-size="15" font-weight="700" font-family="IBM Plex Mono, monospace">net1</text>
    <text x="548" y="303" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">2001:db8:10::100</text>
    <line x1="548" y1="312" x2="480" y2="360" stroke="#2375e8" stroke-width="5"/>
    <rect x="64" y="178" width="256" height="66" rx="12" fill="#f4ecfb" stroke="#7e3fbf" stroke-width="2"/>
    <text x="192" y="205" text-anchor="middle" font-size="16" font-weight="700">SiteRM Agent</text>
    <text x="192" y="228" text-anchor="middle" font-size="14" fill="#52657a">VLANs, routes, host QoS</text>
    <text x="192" y="272" text-anchor="middle" font-size="14" fill="#34465b">Keeps doing its work for the host.</text>
    <text x="192" y="293" text-anchor="middle" font-size="14" fill="#34465b">It does not touch the pod.</text>
    <rect x="408" y="170" width="280" height="84" rx="10" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="548" y="187" text-anchor="middle" font-size="14" fill="#52657a">XRootD container</text>
    <rect x="418" y="194" width="122" height="52" rx="8" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="479" y="216" text-anchor="middle" font-size="16" font-weight="700">XRootD</text>
    <text x="479" y="236" text-anchor="middle" font-size="14" fill="#52657a">data transfer</text>
    <rect x="550" y="194" width="128" height="52" rx="8" fill="#175ec9" stroke="#175ec9" stroke-width="2"/>
    <text x="614" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">siterm-qos</text>
    <text x="614" y="236" text-anchor="middle" font-size="14" fill="#fff">QoS only</text>
    <line x1="479" y1="246" x2="479" y2="260" stroke="#2c8c84" stroke-width="4"/>
    <line x1="614" y1="246" x2="614" y2="260" stroke="#175ec9" stroke-width="4"/>
    <rect x="735" y="136" width="200" height="78" rx="12" fill="#f4ecfb" stroke="#7e3fbf" stroke-width="2"/>
    <text x="835" y="168" text-anchor="middle" font-size="16" font-weight="700">SiteRM Frontend</text>
    <text x="835" y="192" text-anchor="middle" font-size="14" fill="#52657a">active requests</text>
    <line x1="733" y1="196" x2="682" y2="214" stroke="#7e3fbf" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <rect x="735" y="228" width="200" height="96" rx="12" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="835" y="252" text-anchor="middle" font-size="15" font-weight="700">Rules on net1</text>
    <text x="835" y="277" text-anchor="middle" font-size="14" font-family="IBM Plex Mono, monospace" fill="#175ec9">to 2001:db8:20::/64</text>
    <text x="835" y="296" text-anchor="middle" font-size="14" fill="#34465b">SENSE class</text>
    <text x="835" y="315" text-anchor="middle" font-size="14" fill="#34465b">the rest: default class</text>
    <rect x="150" y="436" width="660" height="34" rx="17" fill="#edf7fc" stroke="#c7e6f4"/>
    <text x="480.0" y="458" text-anchor="middle" font-size="14" fill="#34465b">siterm-qos needs Python, ip, tc, openssl and NET_ADMIN. It does not use the SiteRM packages</text>
  </g>
</svg>
