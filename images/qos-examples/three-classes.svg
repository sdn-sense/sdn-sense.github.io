<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Three requests on one host with a 100 gigabit NIC</title>
  <desc id="desc">Horizontal bars on a scale from 0 to 100 Gbps. guaranteedCapped is 10 Gbps and cannot go higher. softCapped requested 20 Gbps and can reach 88.9 Gbps. bestEffort has a 0.1 Gbps base and can reach 6.9 Gbps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2375e8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2c8c84"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e3fbf"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b42318"/></marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker>
  </defs>
  <rect width="960" height="400" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480.0" y="42" text-anchor="middle" font-size="24" font-weight="700">Three requests on one host with a 100G NIC</text>
    <text x="480.0" y="68" text-anchor="middle" font-size="15" fill="#52657a">Limits written by the SiteRM Agent, calculated from its code. This is not measured throughput</text>
    <rect x="25" y="92" width="910" height="250" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <line x1="230.0" y1="140" x2="230.0" y2="300" stroke="#dbe5ee" stroke-width="1"/>
    <text x="230.0" y="322" text-anchor="middle" font-size="14" fill="#52657a">0</text>
    <line x1="395.0" y1="140" x2="395.0" y2="300" stroke="#dbe5ee" stroke-width="1"/>
    <text x="395.0" y="322" text-anchor="middle" font-size="14" fill="#52657a">25</text>
    <line x1="560.0" y1="140" x2="560.0" y2="300" stroke="#dbe5ee" stroke-width="1"/>
    <text x="560.0" y="322" text-anchor="middle" font-size="14" fill="#52657a">50</text>
    <line x1="725.0" y1="140" x2="725.0" y2="300" stroke="#dbe5ee" stroke-width="1"/>
    <text x="725.0" y="322" text-anchor="middle" font-size="14" fill="#52657a">75</text>
    <line x1="890.0" y1="140" x2="890.0" y2="300" stroke="#dbe5ee" stroke-width="1"/>
    <text x="890.0" y="322" text-anchor="middle" font-size="14" fill="#52657a">100 Gbps</text>
    <rect x="230" y="112" width="16" height="12" rx="3" fill="#175ec9"/>
    <text x="254" y="123" text-anchor="start" font-size="14" fill="#34465b">requested rate</text>
    <rect x="390" y="112" width="16" height="12" rx="3" fill="#b9d3f7"/>
    <text x="414" y="123" text-anchor="start" font-size="14" fill="#34465b">may also use, up to the ceiling</text>
    <text x="215" y="166" text-anchor="end" font-size="15" font-weight="700">guaranteedCapped</text>
    <text x="215" y="184" text-anchor="end" font-size="14" fill="#52657a">VLAN 3600</text>
    <rect x="230" y="156" width="66.0" height="24" rx="4" fill="#175ec9"/>
    <text x="306.0" y="173" text-anchor="start" font-size="14" fill="#34465b">10 Gbps, no more</text>
    <text x="215" y="218" text-anchor="end" font-size="15" font-weight="700">softCapped</text>
    <text x="215" y="236" text-anchor="end" font-size="14" fill="#52657a">VLAN 3601</text>
    <rect x="364.0" y="208" width="452.7" height="24" rx="4" fill="#b9d3f7"/>
    <rect x="230" y="208" width="132.0" height="24" rx="4" fill="#175ec9"/>
    <text x="593.0" y="225" text-anchor="middle" font-size="14" fill="#101c2c">20 Gbps requested, up to 88.9 Gbps</text>
    <text x="215" y="270" text-anchor="end" font-size="15" font-weight="700">bestEffort</text>
    <text x="215" y="288" text-anchor="end" font-size="14" fill="#52657a">VLAN 3602</text>
    <rect x="232.7" y="260" width="42.9" height="24" rx="4" fill="#b9d3f7"/>
    <rect x="230" y="260" width="3.0" height="24" rx="1" fill="#175ec9"/>
    <text x="285.54" y="277" text-anchor="start" font-size="14" fill="#34465b">0.1 Gbps base, up to 6.9 Gbps</text>
    <rect x="90" y="354" width="780" height="34" rx="17" fill="#edf7fc" stroke="#c7e6f4"/>
    <text x="480.0" y="376" text-anchor="middle" font-size="14" fill="#34465b">The ceilings add up to 105.8 Gbps on a NIC with 99 Gbps usable, so busy VLANs can still compete</text>
  </g>
</svg>
