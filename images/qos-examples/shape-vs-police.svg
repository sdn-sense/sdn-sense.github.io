<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Shaping on the host compared with policing on the switch</title>
  <desc id="desc">A shaper on the host delays packets in a queue and sends them at a steady rate. A policer on the switch forwards packets up to the rate and drops the rest.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2375e8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2c8c84"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e3fbf"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b42318"/></marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker>
  </defs>
  <rect width="960" height="400" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480.0" y="42" text-anchor="middle" font-size="24" font-weight="700">Two ways to keep traffic under a rate</text>
    <text x="480.0" y="68" text-anchor="middle" font-size="15" fill="#52657a">Hosts shape, switches police. The difference shows up in the throughput</text>
    <rect x="25" y="92" width="445" height="240" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="247" y="122" text-anchor="middle" font-size="19" font-weight="700">Shaping (host)</text>
    <text x="247" y="146" text-anchor="middle" font-size="15" fill="#52657a">Too fast? The packet waits</text>
    <rect x="490" y="92" width="445" height="240" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <text x="712" y="122" text-anchor="middle" font-size="19" font-weight="700">Policing (switch)</text>
    <text x="712" y="146" text-anchor="middle" font-size="15" fill="#52657a">Too fast? The packet is dropped</text>
    <rect x="45" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="510" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="62" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="527" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="79" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="544" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="110" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="575" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="127" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="592" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="144" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="609" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="190" y="172" width="116" height="76" rx="12" fill="#edf7fc" stroke="#31c4f3" stroke-width="2"/>
    <text x="248" y="198" text-anchor="middle" font-size="16" font-weight="700">Queue</text>
    <rect x="204" y="214" width="14" height="14" rx="3" fill="#edf7fc" stroke="#31c4f3" stroke-width="1.5"/>
    <rect x="223" y="214" width="14" height="14" rx="3" fill="#edf7fc" stroke="#31c4f3" stroke-width="1.5"/>
    <rect x="242" y="214" width="14" height="14" rx="3" fill="#edf7fc" stroke="#31c4f3" stroke-width="1.5"/>
    <rect x="261" y="214" width="14" height="14" rx="3" fill="#edf7fc" stroke="#31c4f3" stroke-width="1.5"/>
    <rect x="280" y="214" width="14" height="14" rx="3" fill="#edf7fc" stroke="#31c4f3" stroke-width="1.5"/>
    <line x1="164" y1="210" x2="188" y2="210" stroke="#2375e8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="306" y1="210" x2="330" y2="210" stroke="#2375e8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="336" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="372" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="408" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="444" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <text x="248" y="284" text-anchor="middle" font-size="15" fill="#34465b">Steady output at the rate</text>
    <text x="248" y="308" text-anchor="middle" font-size="14" fill="#52657a">TCP sees a small extra delay and few losses</text>
    <rect x="655" y="172" width="116" height="76" rx="12" fill="#eaf8f5" stroke="#2c8c84" stroke-width="2"/>
    <text x="713" y="204" text-anchor="middle" font-size="16" font-weight="700">Meter</text>
    <text x="713" y="228" text-anchor="middle" font-size="14" fill="#52657a">over the rate?</text>
    <line x1="629" y1="210" x2="653" y2="210" stroke="#2375e8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="771" y1="210" x2="795" y2="210" stroke="#2375e8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="805" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="822" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <rect x="875" y="203" width="14" height="14" rx="3" fill="#175ec9" stroke="#175ec9" stroke-width="1.5"/>
    <text x="850" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#175ec9">no: forward</text>
    <line x1="713" y1="248" x2="713" y2="268" stroke="#b42318" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="691" y="274" width="14" height="14" rx="3" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
    <rect x="708" y="274" width="14" height="14" rx="3" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
    <rect x="725" y="274" width="14" height="14" rx="3" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
    <text x="760" y="287" text-anchor="start" font-size="14" font-weight="700" fill="#b42318">yes: drop</text>
    <text x="713" y="314" text-anchor="middle" font-size="14" fill="#52657a">TCP sees losses, slows down and speeds up again</text>
    <rect x="180" y="348" width="600" height="34" rx="17" fill="#edf7fc" stroke="#c7e6f4"/>
    <text x="480.0" y="370" text-anchor="middle" font-size="14" fill="#34465b">A TCP transfer behind a policer usually settles below the policer rate</text>
  </g>
</svg>
