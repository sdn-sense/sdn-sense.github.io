<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">A bestEffort VLAN on a 400 gigabit switch port</title>
  <desc id="desc">Scale from 0 to 400 Gbps. The first 0.1 Gbps is forwarded normally, traffic up to 268 Gbps is marked as droppable, and traffic above 268 Gbps is dropped.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2375e8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2c8c84"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e3fbf"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b42318"/></marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker>
  </defs>
  <rect width="960" height="330" rx="22" fill="#f5f8fb"/>
  <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#101c2c">
    <text x="480.0" y="42" text-anchor="middle" font-size="24" font-weight="700">One bestEffort VLAN on a 400G port</text>
    <text x="480.0" y="68" text-anchor="middle" font-size="15" fill="#52657a">Limits from the rendered switch configuration, drawn to scale. This is not measured throughput</text>
    <rect x="25" y="92" width="910" height="176" rx="18" fill="#fff" stroke="#adc1d1" stroke-width="2"/>
    <rect x="70.0" y="122" width="546.4" height="74" rx="6" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
    <text x="343.2" y="154" text-anchor="middle" font-size="15" font-weight="700">up to 268 Gbps: forwarded, dropped first if the port is full</text>
    <text x="343.2" y="178" text-anchor="middle" font-size="14" fill="#34465b">only the first 0.1 Gbps is not marked</text>
    <rect x="619.4" y="122" width="270.6" height="74" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="2"/>
    <text x="754.7" y="154" text-anchor="middle" font-size="15" font-weight="700">above 268 Gbps</text>
    <text x="754.7" y="178" text-anchor="middle" font-size="14" fill="#34465b">always dropped</text>
    <line x1="70.0" y1="198" x2="70.0" y2="210" stroke="#52657a" stroke-width="2"/>
    <text x="70.0" y="230" text-anchor="middle" font-size="14" fill="#52657a">0</text>
    <line x1="275.0" y1="198" x2="275.0" y2="210" stroke="#52657a" stroke-width="2"/>
    <text x="275.0" y="230" text-anchor="middle" font-size="14" fill="#52657a">100</text>
    <line x1="480.0" y1="198" x2="480.0" y2="210" stroke="#52657a" stroke-width="2"/>
    <text x="480.0" y="230" text-anchor="middle" font-size="14" fill="#52657a">200</text>
    <line x1="619.4" y1="198" x2="619.4" y2="210" stroke="#52657a" stroke-width="2"/>
    <text x="619.4" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#101c2c">268</text>
    <line x1="890.0" y1="198" x2="890.0" y2="210" stroke="#52657a" stroke-width="2"/>
    <text x="890.0" y="230" text-anchor="middle" font-size="14" fill="#52657a">400 Gbps</text>
    <text x="480" y="254" text-anchor="middle" font-size="14" fill="#34465b">268 is the highest rate this policer takes; the port itself can carry 400</text>
    <rect x="170" y="282" width="620" height="34" rx="17" fill="#edf7fc" stroke="#c7e6f4"/>
    <text x="480.0" y="304" text-anchor="middle" font-size="14" fill="#34465b">One VLAN on this port stays below 268 Gbps, whatever the request is called</text>
  </g>
</svg>
