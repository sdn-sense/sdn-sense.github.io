<text xml:space="preserve" style="white-space:pre" x="875" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1f2933">SENSE router</text>
<text xml:space="preserve" style="white-space:pre" x="875" y="306" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">interface Vlan1010</text>
