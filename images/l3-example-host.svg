<text xml:space="preserve" style="white-space:pre" x="875" y="347" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">ipv6 route f011::/64</text>
<text xml:space="preserve" style="white-space:pre" x="875" y="365" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">… f01f::/64 Vlan1010</text>
<text xml:space="preserve" style="white-space:pre" x="875" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#52606d">native VLAN 1010 on Eth1/3</text>
<text xml:space="preserve" style="white-space:pre" x="875" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#52606d">Same host id (::300) in</text>
<text xml:space="preserve" style="white-space:pre" x="875" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#52606d">every subnet. dtn-01 = ::100,</text>
<text xml:space="preserve" style="white-space:pre" x="875" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#52606d">dtn-08 = ::800, redir = ::900.</text></svg>
