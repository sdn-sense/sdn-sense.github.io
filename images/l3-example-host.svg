<text xml:space="preserve" style="white-space:pre" x="580" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#52606d">on enp1s0f0np0</text>
<text xml:space="preserve" style="white-space:pre" x="36" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">XRootD data server: one instance, listens on [::]:1094, tpc.fixed_route 1</text>
