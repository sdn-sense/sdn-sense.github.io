<text xml:space="preserve" style="white-space:pre" x="36" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1f2933">dtn-03.t2.example.org</text>
<text xml:space="preserve" style="white-space:pre" x="36" y="94" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">main: default via f010::1 dev enp1s0f0np0</text>
<text xml:space="preserve" style="white-space:pre" x="36" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">One gateway for all 16 subnets:</text>
<text xml:space="preserve" style="white-space:pre" x="36" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">no extra interfaces, routing tables or rules.</text>
