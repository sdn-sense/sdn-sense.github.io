<text xml:space="preserve" style="white-space:pre" x="60" y="372" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">2001:db8:6020:f01f::300/64</text>
<text xml:space="preserve" style="white-space:pre" x="290" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">SENSE path 15, preferred_lft 0</text>
